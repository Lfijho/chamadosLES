services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:${HELPDESK_PORT:-8080}:8000"
    environment:
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
    volumes:
      - helpdesk_state:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  diagrams:
    image: plantuml/plantuml:1.2025.10
    profiles: ["tools"]
    user: "${DIAGRAM_UID:-1000}:${DIAGRAM_GID:-1000}"
    volumes:
      - ./docs/diagrams:/work
    working_dir: /work
    command: ["-charset", "UTF-8", "-tsvg", "*.puml"]
    network_mode: none
volumes:
  helpdesk_state:
